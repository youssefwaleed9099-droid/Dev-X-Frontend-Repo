<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>نتيجة الدفع — Dev-X Book Store</title><style>body{font-family:Arial,sans-serif;background:#f6f7fb;margin:0;display:grid;place-items:center;min-height:100vh;color:#17233c}.box{background:#fff;border:1px solid #e2e5ec;border-radius:18px;padding:32px;max-width:520px;width:calc(100% - 40px);text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.06)}a{display:inline-block;margin-top:20px;padding:12px 18px;border-radius:10px;background:#17233c;color:#fff;text-decoration:none}</style></head><body><main class="box"><h1 id="title">جارٍ التحقق من الدفع…</h1><p id="text">النتيجة النهائية للدفع يتم تأكيدها من الخادم عبر إشعار Paymob الآمن.</p><a href="/">العودة للمتجر</a></main><script>const p=new URLSearchParams(location.search);const ok=p.get('success')==='true';document.querySelector('#title').textContent=ok?'تم إرسال نتيجة الدفع بنجاح':'لم يتم تأكيد الدفع';document.querySelector('#text').textContent=ok?'سيتم تحديث حالة الطلب بعد وصول تأكيد Paymob إلى الخادم.':'يمكنك العودة للمتجر ومراجعة حالة الطلب. لا تعتمد صفحة التحويل وحدها على تأكيد الدفع.';</script></body></html>
