services:
  - type: web
    name: devx-book-store
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/ready
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_SSL
        value: "true"
      - key: DB_POOL_MAX
        value: "10"
      - key: DB_IDLE_TIMEOUT_MS
        value: "30000"
      - key: DB_CONNECTION_TIMEOUT_MS
        value: "10000"
      - key: COOKIE_SECURE
        value: "true"
      - key: COOKIE_SAMESITE
        value: Lax
      - key: TRUST_PROXY
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: devx-book-store-db
          property: connectionString
      - key: PAYMOB_BASE_URL
        value: https://accept.paymob.com
      - key: PAYMOB_SECRET_KEY
        sync: false
      - key: PAYMOB_PUBLIC_KEY
        sync: false
      - key: PAYMOB_CARD_INTEGRATION_ID
        sync: false
      - key: PAYMOB_WALLET_INTEGRATION_ID
        sync: false
      - key: PAYMOB_HMAC_SECRET
        sync: false
      - key: PAYMOB_NOTIFICATION_URL
        sync: false
      - key: PAYMOB_REDIRECT_URL
        sync: false
      - key: PAYMOB_CHECKOUT_URL
        sync: false

databases:
  - name: devx-book-store-db
    databaseName: devx_book_store
    user: devx_book_store
